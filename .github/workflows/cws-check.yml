name: Chrome Web Store check

# Signs in to the Chrome Web Store API with the service account and reads the
# item's status, without uploading or submitting anything. Run it by hand after
# changing the credentials. It also runs on pull requests that change the
# publish script or this workflow (pull requests from forks get no secrets, so
# it fails there).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/cws-publish.sh
      - .github/workflows/cws-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sign in and read the item's status
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: mefoajcchbdkfeoinphmigekmjhiipap
        run: ./scripts/cws-publish.sh check
